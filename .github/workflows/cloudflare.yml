# Despliega el estudio en Cloudflare cada vez que se sube algo a la rama
# `cloudflare`. Así no hace falta Docker en tu computadora: lo pone GitHub.
#
# Necesita dos secretos en el repositorio (Settings → Secrets and variables →
# Actions): CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Sin ellos, el paso de
# desplegar se salta. Ver cloudflare/README.md.
name: Desplegar en Cloudflare

on:
  push:
    branches: [cloudflare]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar wrangler
        run: npm ci
        working-directory: cloudflare
      - name: Comprobar el Worker
        run: npm run comprobar
        working-directory: cloudflare
      - name: Desplegar (construye la imagen y la sube)
        if: env.HAY_TOKEN == 'true'
        run: npx wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
